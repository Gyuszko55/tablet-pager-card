<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29b6f6"/>
      <stop offset="1" stop-color="#1a4fc4"/>
    </linearGradient>
    <linearGradient id="lap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f1ff"/>
    </linearGradient>
    <filter id="arnyek" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b2a6b" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- hátsó lapok -->
  <rect x="236" y="118" width="190" height="236" rx="30" fill="#fff" opacity=".28"/>
  <rect x="196" y="104" width="200" height="264" rx="32" fill="#fff" opacity=".5"/>
  <!-- első lap -->
  <g filter="url(#arnyek)">
    <rect x="112" y="88" width="230" height="296" rx="34" fill="url(#lap)"/>
  </g>
  <circle cx="172" cy="154" r="28" fill="#29b6f6"/>
  <path d="M160 156 l9 9 l17 -19" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="214" y="138" width="98" height="14" rx="7" fill="#1a4fc4"/>
  <rect x="214" y="162" width="66" height="12" rx="6" fill="#9db7e8"/>
  <rect x="142" y="214" width="170" height="70" rx="16" fill="#dbe8ff"/>
  <path d="M154 268 l26 -22 l22 14 l30 -28 l28 18 l40 -26" fill="none" stroke="#1a4fc4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="142" y="306" width="120" height="12" rx="6" fill="#9db7e8"/>
  <rect x="142" y="330" width="84" height="12" rx="6" fill="#c7d7f3"/>
  <!-- húzás nyíl -->
  <path d="M88 236 l-26 0 M72 222 l-14 14 l14 14" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <!-- pöttyök -->
